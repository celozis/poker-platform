services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker
      POSTGRES_DB: poker
    ports:
      # Host port 5433 avoids clashing with a locally installed PostgreSQL.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate poker_test database used by backend tests.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker -d poker"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    environment:
      UVICORN_EXTRA_ARGS: --reload
      DATABASE_URL: postgresql+psycopg://poker:poker@db:5432/poker
      TEST_DATABASE_URL: postgresql+psycopg://poker:poker@db:5432/poker_test
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    # Healthy once migrations are applied and the API answers; the bot waits for it.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 2s
      timeout: 5s
      retries: 60

  # The Telegram bot: the backend's image and code, run by long polling. Its token comes from
  # TELEGRAM_BOT_TOKEN in the .env file next to this one; without it the bot logs how to get one
  # and stops.
  bot:
    build: ./backend
    command: python -m app.bot
    # Started again after a crash (say, Telegram unreachable at start), but not after the clean
    # stop without a token.
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+psycopg://poker:poker@db:5432/poker
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # How long before a tournament's start the bot reminds its registered players, in minutes.
      BOT_REMINDER_MINUTES: ${BOT_REMINDER_MINUTES:-120}
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
